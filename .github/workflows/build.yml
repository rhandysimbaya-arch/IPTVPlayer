name: Build IPTV Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IPTVPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-apk
          path: IPTVPlayer.apk

      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest IPTVPlayer.apk \
            --title "IPTV Player (latest build)" \
            --notes "Download IPTVPlayer.apk below and install it on your phone."
